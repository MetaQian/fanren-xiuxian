<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>凡人修仙 · 七玄外传</title>
    <meta name="description" content="《凡人修仙传》世界观同人玩法：凡人流放置修仙，每一次突破皆是生死一线。" />
    <script>
      // 自愈兜底：资源加载失败 / Vue 挂载失败 时，显示白底错误页（避免黑屏无提示）
      (function () {
        var show = function (msg) {
          var b = document.getElementById("boot-err");
          if (!b) return;
          if (msg) { var m = document.getElementById("boot-err-msg"); if (m) m.textContent = msg; }
          b.style.display = "flex";
        };
        window.__showBootErr = show;
        // 捕获 <script type=module> 加载失败（如旧缓存 index 引用了已下线的 JS）
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t.tagName === "SCRIPT") show("资源加载失败（可能是旧缓存）。点下方按钮刷新。");
        }, true);
        // 4 秒后仍未挂载成功 → 也显示
        setTimeout(function () {
          var app = document.querySelector("#app");
          if (!app || app.children.length === 0) show("页面未能正常启动。点下方按钮刷新。");
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="boot-err" style="display:none;position:fixed;inset:0;z-index:9999;background:#f4efe3;color:#2a2418;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;padding:24px;text-align:center">
      <div style="font-size:40px;margin-bottom:12px">🌫️</div>
      <div style="font-size:17px;font-weight:600;margin-bottom:8px">凡人修仙 · 七玄外传</div>
      <div id="boot-err-msg" style="font-size:14px;color:#6b6152;margin-bottom:20px">页面未能正常启动。点下方按钮刷新。</div>
      <button onclick="location.reload()" style="padding:10px 28px;font-size:15px;border:none;border-radius:8px;background:#b8912f;color:#fff;cursor:pointer">刷新重试</button>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
